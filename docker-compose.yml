services:

  # ─── 1. MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: paypulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - paypulse-net

  # ─── 1.1 Redis (distributed rate-limit bucket store) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: paypulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paypulse-net

  # ─── 2. Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paypulse-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Connects as root — Flyway runs migrations + seeds data automatically on startup
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVER_PORT: 8080

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_ENABLED: ${MAIL_ENABLED}
      APP_BASE_URL: ${APP_BASE_URL}

      PAYPULSE_CORS_ALLOWED_ORIGINS: http://10.9.67.127:8085,http://localhost:8080,http://10.9.73.100:8085,http://10.9.74.83:8085

    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - paypulse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s



  # ─── 3. Frontend (nginx serving plain HTML/CSS/JS) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paypulse-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
      - grafana
    networks:
      - paypulse-net

  # ─── 4. Prometheus (Metrics Collector) ─────────────────────────────────────
  # SECURITY: no host port published — reachable only from other containers on
  # paypulse-net (Grafana queries it internally). Scrapes ONLY /actuator/prometheus.
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: paypulse-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - paypulse-net

  # ─── 5. Grafana Loki (Log Aggregator) ──────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: paypulse-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - paypulse-net

  # ─── 6. Promtail (Log Collector — tails Docker container stdout/stderr) ────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: paypulse-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - paypulse-net

  # ─── 7. Grafana (Dashboards: metrics + live log tail) ──────────────────────
  # SECURITY: NOT published to the host — only reachable through the nginx
  # `/grafana/` reverse-proxy path (single public ingress, RBAC via Grafana auth).
  grafana:
    image: grafana/grafana:10.4.0
    container_name: paypulse-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-PayPulseAdmin2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Grafana's default domain ("localhost") gets baked into root_url and used for
      # redirect/cookie checks. Since this app is reached via many different
      # hosts/IPs (localhost, EC2 private IP, etc.), disable that domain enforcement
      # so it doesn't bounce the browser to the wrong (portless) host.
      - GF_SERVER_ENFORCE_DOMAIN=false
      # One-click access for developers (NFR): allow anonymous READ-ONLY (Viewer)
      # access so clicking "Logs" in the app nav opens straight to the dashboard —
      # no login prompt. Editing datasources/dashboards still requires the admin login.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - paypulse-net

volumes:
  mysql_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  paypulse-net:
    driver: bridge

