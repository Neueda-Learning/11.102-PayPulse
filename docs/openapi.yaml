openapi: 3.0.3
info:
  title: Payments Processing API
  description: >
    REST API for managing the full lifecycle of financial payments —
    creation, validation, transmission, completion/failure — with a
    complete audit trail of status transitions. The single operator owns
    multiple accounts (INR/USD); a KPI/analytics dashboard (with live SSE
    updates) and API rate limiting are provided per the 31-Jul-2026
    customer meeting. V2 (05-Aug-2026) adds payment cancellation/reversal,
    CSV export, notifications, and a display-only FX rate lookup.
  version: "2.0.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Accounts
    description: List the operator's own accounts (source-account picker)
  - name: Payments
    description: Create, retrieve, and track payments
  - name: Analytics
    description: KPI dashboard and basic analytics
  - name: Notifications
    description: Email notification management and audit log (V2)
  - name: FX
    description: Hardcoded currency conversion rate used for cross-currency payments (V2)

paths:
  /accounts:
    get:
      tags: [Accounts]
      summary: List the operator's accounts
      operationId: listAccounts
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get a single account by ID
      operationId: getAccountById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments:
    post:
      tags: [Payments]
      summary: Create a new payment
      operationId: createPayment
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Client-generated key to detect duplicate submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created (final status reflected in body after auto-progression)
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '200':
          description: Idempotency-Key matched an existing payment — returning it, no new resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Validation failed (field-level or business-rule, e.g. INVALID_ACCOUNT, INVALID_CURRENCY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: sourceAccountId does not exist, or the requested FX pair has no configured hardcoded rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Payments]
      summary: List / search / filter payments
      operationId: listPayments
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - in: query
          name: search
          schema:
            type: string
          description: Matches against reference or payment ID (partial match)
        - in: query
          name: sourceAccountId
          schema:
            type: string
            format: uuid
          description: Filter to payments from a specific source account
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: Paginated list of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment by ID
      operationId: getPaymentById
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/{id}/history:
    get:
      tags: [Payments]
      summary: Get full status-transition audit trail for a payment
      operationId: getPaymentHistory
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Ordered list of status transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentHistoryResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/{id}/validate:
    post:
      tags: [Payments]
      summary: Explicitly trigger CREATED -> VALIDATED transition
      operationId: validatePayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Transition attempted (payment now VALIDATED or FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Illegal transition attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/{id}/send:
    post:
      tags: [Payments]
      summary: Explicitly trigger VALIDATED -> SENT transition
      operationId: sendPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Transition attempted (payment now SENT or FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Illegal transition attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/{id}/complete:
    post:
      tags: [Payments]
      summary: Explicitly trigger SENT -> COMPLETED transition
      operationId: completePayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Transition attempted (payment now COMPLETED or FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Illegal transition attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /analytics/summary:
    get:
      tags: [Analytics]
      summary: KPI dashboard summary — success/failure rate, avg processing time, throughput, volume
      operationId: getAnalyticsSummary
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiSummaryResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /analytics/trend:
    get:
      tags: [Analytics]
      summary: Time-bucketed trend of payment counts by status
      operationId: getAnalyticsTrend
      parameters:
        - in: query
          name: hours
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Trend buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── V2 additions (05 Aug 2026) ──────────────────────────────────────────

  /payments/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a CREATED payment (V2, feature #18)
      operationId: cancelPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Payment is not in CREATED status — cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/{id}/reverse:
    post:
      tags: [Payments]
      summary: Reverse a COMPLETED payment via a new, linked offsetting payment (V2, feature #19)
      operationId: reversePayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '201':
          description: New offsetting payment created; original flagged as reversed
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Payment is not COMPLETED, or has already been reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /payments/export:
    get:
      tags: [Payments]
      summary: Stream the current filtered payment list as CSV (V2, feature #14)
      operationId: exportPayments
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sourceAccountId
          schema:
            type: string
            format: uuid
        - in: query
          name: sort
          schema:
            type: string
            default: createdAt,desc
            enum: ["createdAt,asc", "createdAt,desc", "amount,asc", "amount,desc", "status,asc", "status,desc"]
      responses:
        '200':
          description: CSV file stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Filtered result exceeds the configured export row cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /analytics/stream:
    get:
      tags: [Analytics]
      summary: Server-Sent Events stream of live KPI updates (V2) — replaces the 30s dashboard poll
      operationId: streamAnalytics
      responses:
        '200':
          description: text/event-stream — a KpiSummaryResponse pushed on each payment status transition (debounced)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/KpiSummaryResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /fx/rate:
    get:
      tags: [FX]
      summary: Hardcoded FX conversion rate (V2, feature #20)
      operationId: getFxRate
      parameters:
        - in: query
          name: from
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - in: query
          name: to
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
      responses:
        '200':
          description: Hardcoded conversion rate used both for preview and cross-currency payment creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateResponse'
        '404':
          description: Unsupported/unconfigured currency pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /notifications/send:
    post:
      tags: [Notifications]
      summary: Send an ad-hoc email notification (V2, already implemented, now documented)
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '200':
          description: Email dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResult'
        '500':
          description: Email dispatch failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailResult'

  /notifications:
    get:
      tags: [Notifications]
      summary: List notification audit logs (V2)
      operationId: listNotifications
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, SENT, FAILED]
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated notification logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationLog'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

  /notifications/{notificationId}:
    get:
      tags: [Notifications]
      summary: Get a single notification log by ID (V2)
      operationId: getNotification
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification log found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationLog'
        '404':
          description: Not found

  /notifications/by-payment/{paymentId}:
    get:
      tags: [Notifications]
      summary: Get all notifications linked to a specific payment (V2)
      operationId: getNotificationsByPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: List of notification logs for the payment (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationLog'

components:
  parameters:
    PaymentId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  responses:
    RateLimited:
      description: Rate limit exceeded (token bucket exhausted)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the client may retry
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    PaymentStatus:
      type: string
      enum: [CREATED, VALIDATED, SENT, COMPLETED, FAILED, CANCELLED]
      description: >
        CANCELLED added in V2 (feature #18) — terminal, reachable only from CREATED.

    CurrencyCode:
      type: string
      enum: [INR, USD]
      description: >
        Only INR and USD are supported (customer-confirmed 31 Jul 2026).
        Cross-currency payouts are allowed in V2 feature #20 using a hardcoded configured INR↔USD rate.

    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "b2c3d4e5-1111-4a11-8a11-111111111111"
        label:
          type: string
          example: "Primary INR Savings"
        accountNumber:
          type: string
          example: ACC1000001
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AccountStatus'

    CreatePaymentRequest:
      type: object
      required: [sourceAccountId, amount, currency, targetCurrency, destinationAccount]
      properties:
        sourceAccountId:
          type: string
          format: uuid
          example: "b2c3d4e5-1111-4a11-8a11-111111111111"
          description: Must reference an existing, ACTIVE Account (see GET /accounts)
        amount:
          type: number
          format: double
          example: 250.00
          minimum: 0.01
          maximum: 1000000
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        targetCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        destinationAccount:
          type: string
          minLength: 8
          maxLength: 20
          pattern: '^[A-Za-z0-9]{8,20}$'
          example: ACC2000002
          description: 8–20 alphanumeric chars; must differ from source account number (format-validated only, external party not existence-checked)
        reference:
          type: string
          maxLength: 255
          nullable: true
          example: "Invoice #4471"
        forceFailureStage:
          type: string
          enum: [ NONE, CREATE, VALIDATE, SEND ]
          nullable: true
          default: NONE
          description: >
            UI/QA-only switch to deterministically force this payment to fail
            at a specific lifecycle stage. COMPLETE is intentionally excluded —
            once a payment reaches SEND successfully, completion cannot be
            forced to fail via this field (money has already moved by then).

    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        targetCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        convertedAmount:
          type: number
          format: double
          description: Final payout amount after conversion into targetCurrency
        fxRate:
          type: number
          format: double
          description: Hardcoded current conversion rate used for this payment (1.0 for same-currency)
        destinationAccount:
          type: string
        reference:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reversed:
          type: boolean
          default: false
          description: V2 (feature #19) — true once this payment has been reversed
        reversalPaymentId:
          type: string
          format: uuid
          nullable: true
          description: V2 — set on the ORIGINAL payment, points to the new offsetting payment
        reversalOfPaymentId:
          type: string
          format: uuid
          nullable: true
          description: V2 — set on the NEW reversal payment, points back to the original

    PaymentHistoryResponse:
      type: object
      properties:
        previousStatus:
          $ref: '#/components/schemas/PaymentStatus'
          nullable: true
        newStatus:
          $ref: '#/components/schemas/PaymentStatus'
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        triggeredBy:
          type: string
          example: SYSTEM
        occurredAt:
          type: string
          format: date-time

    PaymentPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    KpiSummaryResponse:
      type: object
      description: >
        Business-meaningful metrics only (customer directive, MEM-019) —
        no vanity/fancy metrics.
      properties:
        totalPayments:
          type: integer
          example: 1287
        successRatePct:
          type: number
          format: double
          example: 94.2
        failureRatePct:
          type: number
          format: double
          example: 5.8
        avgProcessingTimeSeconds:
          type: number
          format: double
          example: 0.84
        throughputPerMinute:
          type: number
          format: double
          example: 53.6
        volumeByCurrency:
          type: object
          additionalProperties:
            type: number
            format: double
          example: { "INR": 1845200.00, "USD": 42310.50 }
        topFailureReasons:
          type: object
          additionalProperties:
            type: integer
          example: { "NETWORK_ERROR": 41, "INVALID_CURRENCY": 12 }

    TrendBucket:
      type: object
      properties:
        periodStart:
          type: string
          format: date-time
        created:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    TrendResponse:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/TrendBucket'

    ApiError:
      type: object
      properties:
        errorCode:
          type: string
          example: INVALID_AMOUNT
        message:
          type: string
          example: Amount must be greater than 0
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /api/v1/payments

    # ── V2 schemas (05 Aug 2026) ────────────────────────────────────────────

    FxRateResponse:
      type: object
      description: Hardcoded current conversion rate used by both frontend preview and backend payment conversion (MEM-031)
      properties:
        from:
          $ref: '#/components/schemas/CurrencyCode'
        to:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          type: number
          format: double
          example: 0.012
        asOf:
          type: string
          format: date-time
          description: Config reload timestamp — NOT a live market rate

    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]

    NotificationLog:
      type: object
      description: Audit trail row for a single email notification attempt (V5__create_notification_log_table.sql)
      properties:
        id:
          type: integer
          format: int64
        notificationId:
          type: string
          format: uuid
        recipientEmail:
          type: string
        recipientName:
          type: string
          nullable: true
        subject:
          type: string
        templateName:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        failureReason:
          type: string
          nullable: true
        paymentId:
          type: string
          format: uuid
          nullable: true
        eventType:
          type: string
          example: PAYMENT_COMPLETED
        attempts:
          type: integer
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SendNotificationRequest:
      type: object
      required: [recipientEmail, event]
      properties:
        recipientEmail:
          type: string
          format: email
        recipientName:
          type: string
          nullable: true
        event:
          type: string
          enum: [PAYMENT_CREATED, PAYMENT_COMPLETED, PAYMENT_FAILED, WELCOME]
        paymentId:
          type: string
          format: uuid
          nullable: true
        variables:
          type: object
          additionalProperties: true

    EmailResult:
      type: object
      properties:
        success:
          type: boolean
        notificationId:
          type: string
          format: uuid
          nullable: true
        failureReason:
          type: string
          nullable: true

