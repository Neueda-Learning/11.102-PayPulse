<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>PayPulse — Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">P</span> PayPulse</div>
  <nav class="nav">
    <a href="index.html">Dashboard</a>
    <a href="accounts.html">Accounts</a>
    <a href="create-payment.html">Create Payment</a>
    <a href="payments.html">Payments</a>
  </nav>
</header>

<main>
  <div class="page-head">
    <h1>Dashboard</h1>
    <p id="subhead">Loading KPIs...</p>
  </div>

  <div id="kpiGrid" class="kpi-grid"></div>

  <div class="card">
    <h2>Volume by Currency</h2>
    <div id="volumeGrid" class="kpi-grid"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <h2 id="trendTitle">Payments — Last 24 Hours (Trend)</h2>
      <div style="display:flex;gap:10px;align-items:center;">
        <label for="trendWindow" style="font-size:12px;font-weight:700;color:#374151;">Window</label>
        <select id="trendWindow" aria-label="Trend window">
          <option value="24">Last 24 hours</option>
          <option value="48">Last 48 hours</option>
          <option value="168">Last 7 days</option>
        </select>
        <label for="trendView" style="font-size:12px;font-weight:700;color:#374151;">View</label>
        <select id="trendView" aria-label="Trend view mode">
          <option value="status">Status Counts</option>
          <option value="currency">Volume by Currency</option>
        </select>
      </div>
    </div>
    <div id="trendBars" class="bars"></div>
    <div id="trendLegend" style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:#6b7280;">
      <span>🟢 Completed</span><span>🔴 Failed</span>
    </div>
  </div>

  <div class="card">
    <h2>Top Failure Reasons</h2>
    <table class="table">
      <thead><tr><th>Error Code</th><th id="failureWindowLabel">Count (last 24h)</th></tr></thead>
      <tbody id="failureTable"></tbody>
    </table>
  </div>
</main>
<script src="js/api.js"></script>
<script>
let currentTrendHours = 24;
let currentTrendView = 'status';

async function loadDashboard() {
  try {
    const summary = await Analytics.summary();
    updateDashboardFromSummary(summary);
    await updateTrend();
  } catch (err) {
    document.getElementById('subhead').textContent = '';
    document.getElementById('kpiGrid').innerHTML =
      `<div class="notice error">Could not load KPIs: ${err.message || 'Unknown error'}. Is the backend running?</div>`;
  }
}

async function updateTrend() {
  try {
    const trend = await Analytics.trend(currentTrendHours);
    const buckets = trend.buckets || [];
    renderTrend(buckets);
    document.getElementById('trendTitle').textContent =
      `Payments - Last ${currentTrendHours} Hours (Trend)`;
    document.getElementById('failureWindowLabel').textContent =
      `Count (last ${currentTrendHours}h)`;
  } catch (_) {
    document.getElementById('trendBars').innerHTML =
      '<div class="empty-state">Could not load trend data.</div>';
  }
}

function renderTrend(buckets) {
  const shown = buckets.slice(-Math.min(24, buckets.length));
  const barsEl = document.getElementById('trendBars');
  const legendEl = document.getElementById('trendLegend');

  if (!shown.length) {
    barsEl.innerHTML = '<div class="empty-state">No data for the selected window.</div>';
    legendEl.innerHTML = '';
    return;
  }

  if (currentTrendView === 'currency') {
    const maxVal = Math.max(1, ...shown.map(b => {
      const vol = b.volumeByCurrency || {};
      return Number(vol.INR || 0) + Number(vol.USD || 0);
    }));

    barsEl.innerHTML = shown.map(b => {
      const vol = b.volumeByCurrency || {};
      const inr = Number(vol.INR || 0);
      const usd = Number(vol.USD || 0);
      const total = inr + usd;
      const inrH = total > 0 ? Math.round((inr / maxVal) * 100) : 0;
      const usdH = total > 0 ? Math.round((usd / maxVal) * 100) : 0;
      const label = new Date(b.periodStart).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      return `<div class="bar-col">
        <div class="bar completed" style="height:${inrH}%" title="INR ${inr.toFixed(2)}"></div>
        <div class="bar failed" style="height:${usdH}%" title="USD ${usd.toFixed(2)}"></div>
        <div class="bar-label">${label}</div>
      </div>`;
    }).join('');

    legendEl.innerHTML = '<span>INR Volume</span><span>USD Volume</span>';
    return;
  }

  const maxVal = Math.max(1, ...shown.map(b => Math.max(b.created || 0, b.completed || 0, b.failed || 0)));
  barsEl.innerHTML = shown.map(b => {
    const cH = Math.round(((b.completed || 0) / maxVal) * 100);
    const fH = Math.round(((b.failed || 0) / maxVal) * 100);
    const label = new Date(b.periodStart).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `<div class="bar-col">
      <div class="bar completed" style="height:${cH}%" title="${b.completed || 0} completed"></div>
      <div class="bar failed" style="height:${fH}%" title="${b.failed || 0} failed"></div>
      <div class="bar-label">${label}</div>
    </div>`;
  }).join('');
  legendEl.innerHTML = '<span>Completed</span><span>Failed</span>';
}

function updateDashboardFromSummary(summary) {
  document.getElementById('subhead').textContent = 'Live data - updates in real time via SSE.';

  document.getElementById('kpiGrid').innerHTML = [
    kpiCard('Total Payments', summary.totalPayments, ''),
    kpiCard('Success Rate', summary.successRatePct.toFixed(1) + '%', 'green', 'COMPLETED / terminal'),
    kpiCard('Failure Rate', summary.failureRatePct.toFixed(1) + '%', 'red', 'FAILED / terminal'),
    kpiCard('Avg. Processing Time', summary.avgProcessingTimeSeconds.toFixed(2) + 's', 'blue', 'CREATED to COMPLETED'),
    kpiCard('Throughput', summary.throughputPerMinute.toFixed(1) + '/min', 'blue', 'trailing window')
  ].join('');

  const vol = summary.volumeByCurrency || {};
  document.getElementById('volumeGrid').innerHTML =
    kpiCard('INR Volume', formatMoney(vol.INR || 0, 'INR'), '', 'sum of COMPLETED INR payments') +
    kpiCard('USD Volume', formatMoney(vol.USD || 0, 'USD'), '', 'sum of COMPLETED USD payments');

  const reasons = summary.topFailureReasons || {};
  const tbody = document.getElementById('failureTable');
  const entries = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    tbody.innerHTML = `<tr><td colspan="2" class="empty-state">No failures in the last ${currentTrendHours}h</td></tr>`;
  } else {
    tbody.innerHTML = entries.map(([code, count]) =>
      `<tr><td><code>${code}</code></td><td>${count}</td></tr>`
    ).join('');
  }
}

function kpiCard(label, value, colorClass, sub) {
  return `<div class="kpi-card ${colorClass}">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

document.getElementById('trendWindow').addEventListener('change', async (e) => {
  currentTrendHours = parseInt(e.target.value, 10) || 24;
  await updateTrend();
  await loadDashboard();
});

document.getElementById('trendView').addEventListener('change', (e) => {
  currentTrendView = e.target.value;
  updateTrend();
});

// SSE: replace 30s poll with server-sent events (MEM-027)
(function initSSE() {
  if (!window.EventSource) {
    setInterval(loadDashboard, 30000);
    return;
  }

  let retryCount = 0;
  function connect() {
    const es = new EventSource('/api/v1/analytics/stream');
    es.addEventListener('kpi', (e) => {
      try {
        const summary = JSON.parse(e.data);
        updateDashboardFromSummary(summary);
        updateTrend();
        retryCount = 0;
      } catch (_) {}
    });

    es.onerror = () => {
      es.close();
      retryCount++;
      if (retryCount >= 5) {
        setInterval(loadDashboard, 30000);
        return;
      }
      setTimeout(connect, Math.min(30000, 1000 * Math.pow(2, retryCount)));
    };
  }

  connect();
})();

loadDashboard();
</script>
</body>
</html>
