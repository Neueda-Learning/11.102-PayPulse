<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>PayPulse — Payments</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">P</span> PayPulse</div>
  <nav class="nav">
    <a href="index.html">Dashboard</a>
    <a href="accounts.html">Accounts</a>
    <a href="create-payment.html">Create Payment</a>
    <a href="payments.html">Payments</a>
  </nav>
</header>

<main>
  <div class="page-head">
    <h1>Payments</h1>
    <p>Browse, filter, and search all payments. Click any row to view full details.</p>
  </div>

  <div class="toolbar">
    <label for="statusFilter" style="font-size:12px;font-weight:700;color:#374151;">Status</label>
    <select id="statusFilter" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="CREATED">CREATED</option>
      <option value="VALIDATED">VALIDATED</option>
      <option value="SENT">SENT</option>
      <option value="COMPLETED">COMPLETED</option>
      <option value="FAILED">FAILED</option>
      <option value="CANCELLED">CANCELLED</option>
    </select>
    <input type="search" id="searchBox" placeholder="Search by ID or reference..."
           aria-label="Search payments"/>
    <button class="btn ghost" id="clearBtn" type="button">Clear</button>
    <button class="btn" id="refreshBtn" type="button">Refresh</button>
    <button class="btn ghost" id="exportBtn" type="button" title="Download the current filtered list as CSV">⬇ Export CSV</button>
  </div>

  <div class="card" style="padding:0;">
    <table class="table">
        <thead>
        <tr>
            <th>Payment ID</th>
            <th>Source Account</th>
            <th>Destination</th>
            <th class="sortable" data-field="amount" onclick="setSort('amount')" style="cursor:pointer;">Amount <span id="sort-amount"></span></th>
            <th class="sortable" data-field="status" onclick="setSort('status')" style="cursor:pointer;">Status <span id="sort-status"></span></th>
            <th class="sortable" data-field="createdAt" onclick="setSort('createdAt')" style="cursor:pointer;">Created <span id="sort-createdAt">▼</span></th>
        </tr>
        </thead>
      <tbody id="paymentsBody">
        <tr><td colspan="6" class="empty-state"><span class="spinner"></span> Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="pagination" style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:4px;"></div>
</main>

<script src="js/api.js"></script>
<script>
async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'absolute';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function showCopyNotice(message) {
  const existing = document.getElementById('copy-notice');
  if (existing) existing.remove();
  const notice = document.createElement('div');
  notice.id = 'copy-notice';
  notice.className = 'notice success';
  notice.textContent = message;
  const main = document.querySelector('main');
  main.prepend(notice);
  setTimeout(() => notice.remove(), 1800);
}

async function copyPaymentId(event, id) {
  event.stopPropagation();
  event.preventDefault();
  try {
    await copyToClipboard(id);
    showCopyNotice('Payment ID copied.');
  } catch (_) {
    alert('Could not copy payment ID.');
  }
}

let currentPage = 0;
let totalPages = 0;
let accountMap = {};

let currentSort = 'createdAt';
let currentDir = 'desc';

function setSort(field) {
  if (currentSort === field) {
    currentDir = currentDir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = field;
    currentDir = 'desc';
  }
  updateSortIndicators();
  loadPayments(0);
}

function updateSortIndicators() {
  ['amount', 'status', 'createdAt'].forEach(f => {
    const el = document.getElementById('sort-' + f);
    if (el) el.textContent = currentSort === f ? (currentDir === 'asc' ? '▲' : '▼') : '';
  });
}

async function loadAccountMap() {
  try {
    const accs = await Accounts.list();
    accs.forEach(a => { accountMap[a.id] = `${a.label} (${a.accountNumber})`; });
  } catch (_) {}
}

async function loadPayments(page = 0) {
  const tbody = document.getElementById('paymentsBody');
  tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><span class="spinner"></span> Loading...</td></tr>';

  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchBox').value.trim();

  try {
    const data = await Payments.list({ status, search, page, size: 20, sort: `${currentSort},${currentDir}` });
    currentPage = data.number;
    totalPages  = data.totalPages;

    if (!data.content || !data.content.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No payments found.</td></tr>';
      renderPagination();
      return;
    }

    tbody.innerHTML = data.content.map(p => `
      <tr class="clickable" onclick="window.location.href='payment-details.html?id=${encodeURIComponent(p.id)}'">
        <td>
          <code style="font-size:11px;">${p.id}</code>
          <span class="inline-actions">
            <button type="button" class="btn ghost copy-btn" onclick="copyPaymentId(event, '${p.id}')">Copy</button>
          </span>
        </td>
        <td>${accountMap[p.sourceAccountId] || p.sourceAccountId}</td>
        <td>${p.destinationAccount}</td>
        <td>
          ${formatMoney(p.amount, p.currency)}
          ${p.targetCurrency && p.targetCurrency !== p.currency && p.convertedAmount != null
            ? `<span class="subtle-meta">Payout: ${formatMoney(p.convertedAmount, p.targetCurrency)}</span>`
            : ''}
        </td>
        <td>${badgeHtml(p.status)}</td>
        <td>${formatDateTime(p.createdAt)}</td>
      </tr>
    `).join('');

    renderPagination();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="notice error">Failed to load payments: ${err.message || 'Unknown error'}</div></td></tr>`;
  }
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="btn ghost" onclick="loadPayments(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>← Prev</button>
    <span>Page ${currentPage + 1} of ${totalPages}</span>
    <button class="btn ghost" onclick="loadPayments(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>Next →</button>
  `;
}

document.getElementById('statusFilter').addEventListener('change', () => loadPayments(0));
document.getElementById('searchBox').addEventListener('input', () => loadPayments(0));
document.getElementById('refreshBtn').addEventListener('click', () => loadPayments(currentPage));
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('statusFilter').value = '';
  document.getElementById('searchBox').value = '';
  loadPayments(0);
});

// ── CSV Export (feature #14, V2) ──────────────────────────────────────────
// Exports the FULL filtered result set (current status/search filters),
// not just the current page. Uses fetch()+Blob (not a raw navigation) so
// that an error response (e.g. 400 EXPORT_TOO_LARGE) shows a proper inline
// notice instead of replacing the whole page with raw JSON.
document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchBox').value.trim();
  const url = Payments.exportUrl({ status, search });

  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Exporting...';

  try {
    const res = await fetch(url);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ message: res.statusText }));
      throw err;
    }
    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="([^"]+)"/);
    const filename = match ? match[1] : `payments-export-${Date.now()}.csv`;

    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (err) {
    alert(`Export failed: ${err.message || 'Unknown error'}`);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

// Support ?status=FAILED deep link
const initialStatus = getQueryParam('status');
if (initialStatus) document.getElementById('statusFilter').value = initialStatus;

loadAccountMap().then(() => loadPayments(0));
</script>
</body>
</html>
