spring:
  datasource:
    url: jdbc:h2:mem:paypulse_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

# Add this at the bottom, aligned fully to the left
paypulse:
  cors:
    allowed-origins: "http://localhost:3000"