# backend/src/test/resources/application-test.yml

spring:
  datasource:
    url: jdbc:h2:mem:paypulse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false           # Use ddl-auto in tests, not Flyway migrations

paypulse:
  fx:
    as-of: 2026-08-06T00:00:00Z
    rates:
      INR-USD: 0.012
      USD-INR: 83.330000
  notification:
    email:
      from-address: noreply@paypulse.io
      from-name: PayPulse Payments
      enabled: true
      support-email: support@paypulse.io
      base-url: http://localhost:3000