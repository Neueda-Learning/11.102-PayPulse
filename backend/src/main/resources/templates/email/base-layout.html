<!-- backend/src/main/resources/templates/email/base-layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- FIXED: Changed th:replace to th:text to safely render the string variable -->
    <title th:text="${title}">PayPulse Notification</title>
    <style>
        /* ── Reset ────────────────────────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                       Roboto, Helvetica, Arial, sans-serif;
          background-color: #f0f4f8;
          color: #1a202c;
          -webkit-font-smoothing: antialiased;
        }
        /* ── Wrapper ──────────────────────────────────────────────────────────── */
        .wrapper {
          width: 100%;
          background-color: #f0f4f8;
          padding: 40px 16px;
        }
        .container {
          max-width: 600px;
          margin: 0 auto;
          background-color: #ffffff;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        /* ── Header ───────────────────────────────────────────────────────────── */
        .header {
          background: linear-gradient(135deg, #1a56db 0%, #0e3fad 100%);
          padding: 32px 40px;
          text-align: center;
        }
        .header .brand {
          display: inline-block;
        }
        .header .logo-text {
          font-size: 28px;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.5px;
        }
        .header .logo-pulse {
          color: #93c5fd;
        }
        .header .tagline {
          font-size: 13px;
          color: #bfdbfe;
          margin-top: 4px;
          letter-spacing: 0.5px;
        }
        /* ── Body ─────────────────────────────────────────────────────────────── */
        .body {
          padding: 40px 40px 32px;
        }
        .greeting {
          font-size: 22px;
          font-weight: 700;
          color: #1a202c;
          margin-bottom: 12px;
        }
        .lead {
          font-size: 15px;
          color: #4a5568;
          line-height: 1.7;
          margin-bottom: 28px;
        }
        /* ── Detail Card ──────────────────────────────────────────────────────── */
        .detail-card {
          background-color: #f7faff;
          border: 1px solid #dbeafe;
          border-radius: 10px;
          padding: 24px;
          margin-bottom: 28px;
        }
        .detail-card .card-title {
          font-size: 11px;
          font-weight: 700;
          color: #2563eb;
          letter-spacing: 1px;
          text-transform: uppercase;
          margin-bottom: 16px;
        }
        .detail-row {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          padding: 10px 0;
          border-bottom: 1px solid #e2e8f0;
          font-size: 14px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
          color: #718096;
          font-weight: 500;
          flex: 0 0 45%;
        }
        .detail-value {
          color: #1a202c;
          font-weight: 600;
          text-align: right;
          flex: 0 0 52%;
          word-break: break-all;
        }
        /* ── Status Badge ─────────────────────────────────────────────────────── */
        .status-badge {
          display: inline-block;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.5px;
          text-transform: uppercase;
        }
        .status-success  { background:#dcfce7; color:#166534; }
        .status-failed   { background:#fee2e2; color:#991b1b; }
        .status-pending  { background:#fef3c7; color:#92400e; }
        .status-created  { background:#dbeafe; color:#1e40af; }
        /* ── CTA Button ───────────────────────────────────────────────────────── */
        .cta-block { text-align: center; margin: 28px 0; }
        .btn {
          display: inline-block;
          padding: 14px 36px;
          border-radius: 8px;
          font-size: 15px;
          font-weight: 700;
          text-decoration: none;
          letter-spacing: 0.3px;
        }
        .btn-primary { background-color: #1a56db; color: #ffffff; }
        .btn-danger  { background-color: #dc2626; color: #ffffff; }
        .btn-success { background-color: #16a34a; color: #ffffff; }
        /* ── Divider ──────────────────────────────────────────────────────────── */
        .divider {
          height: 1px;
          background-color: #e2e8f0;
          margin: 28px 0;
        }
        /* ── Footer ───────────────────────────────────────────────────────────── */
        .footer {
          background-color: #f7faff;
          border-top: 1px solid #e2e8f0;
          padding: 28px 40px;
          text-align: center;
        }
        .footer p {
          font-size: 12px;
          color: #718096;
          line-height: 1.8;
          margin-bottom: 4px;
        }
        .footer a { color: #2563eb; text-decoration: none; }
        .footer .company {
          font-size: 11px;
          color: #a0aec0;
          margin-top: 12px;
        }
        /* ── Responsive ───────────────────────────────────────────────────────── */
        @media only screen and (max-width: 480px) {
          .body        { padding: 24px 20px; }
          .footer      { padding: 20px; }
          .header      { padding: 24px 20px; }
          .detail-row  { flex-direction: column; }
          .detail-value{ text-align: left; margin-top: 4px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="brand">
                <div class="logo-text">Pay<span class="logo-pulse">Pulse</span></div>
                <div class="tagline">Instant · Secure · Reliable</div>
            </div>
        </div>

        <!-- BODY (injected by child template) -->
        <div class="body" th:replace="${content}">
            <!-- child content goes here -->
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>Questions? Contact us at
                <a th:href="'mailto:' + ${supportEmail}"
                   th:text="${supportEmail}">support@paypulse.io</a>
            </p>
            <p>This is an automated message — please do not reply directly.</p>
            <div class="company">
                &copy; 2026 PayPulse. All rights reserved.<br/>
                PayPulse Payment Processing Platform
            </div>
        </div>

    </div>
</div>
</body>
</html>
