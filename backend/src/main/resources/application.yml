# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080
  tomcat:
    max-swallow-size: 2MB


# ── Spring Datasource (local dev — root/n3u3da!) ──────────────────────────────
# For Docker, these are overridden by SPRING_DATASOURCE_* env vars in docker-compose.yml

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/paypulse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "n3u3da!"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20       # NFR-10: sized for ~667 req/sec burst
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PayPulseHikariPool

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns schema — Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  # ── Request limits (NFR-14 security) ─────────────────────────────────────────
  servlet:
    multipart:
      max-request-size: 2MB
      max-file-size: 1MB

  # ── Jackson ───────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

# ── Actuator (health endpoint used by Docker healthcheck) ─────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ── SpringDoc / Swagger UI ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      paymentSend:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
      paymentComplete:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      paymentValidate:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - com.paypulse.payment.service.SimulatedProcessingException
      paymentSend:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.paypulse.payment.service.SimulatedProcessingException
      paymentComplete:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - com.paypulse.payment.service.SimulatedProcessingException

# ── PayPulse App Config ────────────────────────────────────────────────────────
paypulse:
  rate-limit:
    global-requests-per-minute: 40000   # NFR-10/11: ~667 req/sec ceiling 4000
    per-client-requests-per-minute: 2000 # fair-share per IP 2000         # 5% random failure rate
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080,http://localhost:63342,http://10.9.67.127:8085"
  simulation:
    create-failure-account: FAILCREATE01     # NEW — fails before any Payment row is persisted
    validate-failure-account: FAILVALIDATE01 # NEW — fails CREATED -> FAILED
    send-failure-account: FAILTEST01         # renamed usage of the existing property
    complete-failure-account: FAILCOMPLETE01 # NEW — fails SENT -> FAILED
    random-failure-rate: 0.05

  notification:
    email:
      from-address: ${MAIL_FROM_ADDRESS:noreply@paypulse.io}
      from-name: ${MAIL_FROM_NAME:PayPulse Payments}
      enabled: ${MAIL_ENABLED:true}
      max-retry-attempts: 3
      support-email: support@paypulse.io
      logo-url: https://paypulse.io/assets/logo.png
      base-url: ${APP_BASE_URL:http://localhost:3000}

