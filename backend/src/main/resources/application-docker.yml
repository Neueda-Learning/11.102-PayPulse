# Docker profile — overrides for the paypulse-backend container.
# Spring datasource URL and credentials come from docker-compose environment variables;
# they are already set via SPRING_DATASOURCE_* env vars injected by Docker Compose,
# so we only need docker-specific overrides here.

spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

paypulse:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://frontend"
      - "http://paypulse-frontend"
    notification:
      email:
        from-address: ${MAIL_FROM_ADDRESS:noreply@paypulse.io}
        from-name: ${MAIL_FROM_NAME:PayPulse Payments}
        enabled: ${MAIL_ENABLED:true

logging:
  level:
    com.paypulse: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

